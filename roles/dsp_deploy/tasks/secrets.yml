---
# Secrets are created only when absent so re-runs don't churn generated values.
# kubernetes.core.k8s takes the secret data as structured input (base64), so no
# secret ever appears on a command line.
- name: Look up existing DSP secrets
  kubernetes.core.k8s_info:
    kubeconfig: "{{ dsp_kubeconfig }}"
    kind: Secret
    namespace: "{{ dsp_namespace }}"
    name: "{{ item }}"
  loop:
    - kas-private-keys
    - cosign-policyimportexport-keys
    - "{{ dsp_db_credentials_secret }}"
    - dsp-enc-search-key
  register: dsp_secret_lookup

- name: Index which secrets already exist
  ansible.builtin.set_fact:
    dsp_present_secrets: "{{ dsp_secret_lookup.results | selectattr('resources') | map(attribute='item') | list }}"

- name: Create KAS private keys secret
  kubernetes.core.k8s:
    kubeconfig: "{{ dsp_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: kas-private-keys
        namespace: "{{ dsp_namespace }}"
      type: Opaque
      data:
        kas-cert.pem: "{{ lookup('ansible.builtin.file', dsp_extract_dir ~ '/keys/kas-cert.pem') | b64encode }}"
        kas-private.pem: "{{ lookup('ansible.builtin.file', dsp_extract_dir ~ '/keys/kas-private.pem') | b64encode }}"
        kas-ec-cert.pem: "{{ lookup('ansible.builtin.file', dsp_extract_dir ~ '/keys/kas-ec-cert.pem') | b64encode }}"
        kas-ec-private.pem: "{{ lookup('ansible.builtin.file', dsp_extract_dir ~ '/keys/kas-ec-private.pem') | b64encode }}"
  when: "'kas-private-keys' not in dsp_present_secrets"

- name: Fail if cosign key exists but its secret was lost
  ansible.builtin.fail:
    msg: >-
      cosign-policyimportexport-keys secret is missing but a cosign key exists on
      disk; its passphrase is unrecoverable. Delete
      {{ dsp_extract_dir }}/keys/cosign and re-run to regenerate.
  when:
    - "'cosign-policyimportexport-keys' not in dsp_present_secrets"
    - dsp_cosign_password_effective is not defined

- name: Create cosign keys secret
  kubernetes.core.k8s:
    kubeconfig: "{{ dsp_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cosign-policyimportexport-keys
        namespace: "{{ dsp_namespace }}"
      type: Opaque
      data:
        cosign.key: "{{ lookup('ansible.builtin.file', dsp_extract_dir ~ '/keys/cosign/cosign.key') | b64encode }}"
        cosign.pub: "{{ lookup('ansible.builtin.file', dsp_extract_dir ~ '/keys/cosign/cosign.pub') | b64encode }}"
        cosign.pass: "{{ dsp_cosign_password_effective | b64encode }}"
  no_log: true
  when:
    - "'cosign-policyimportexport-keys' not in dsp_present_secrets"
    - dsp_cosign_password_effective is defined

- name: Create database credentials secret
  kubernetes.core.k8s:
    kubeconfig: "{{ dsp_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ dsp_db_credentials_secret }}"
        namespace: "{{ dsp_namespace }}"
      type: Opaque
      data:
        password: >-
          {{ (dsp_db_password if (dsp_db_password | length > 0)
             else lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits'))
             | b64encode }}
  no_log: true
  when: "dsp_db_credentials_secret not in dsp_present_secrets"

- name: Create encrypted search key secret
  kubernetes.core.k8s:
    kubeconfig: "{{ dsp_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: dsp-enc-search-key
        namespace: "{{ dsp_namespace }}"
      type: Opaque
      data:
        encrypted-search-key: >-
          {{ lookup('ansible.builtin.password', '/dev/null length=64 chars=hexdigits')
             | lower | b64encode }}
  no_log: true
  when: "'dsp-enc-search-key' not in dsp_present_secrets"
