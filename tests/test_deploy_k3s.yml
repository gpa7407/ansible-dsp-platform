---
# Test playbook for virtru.dsp_platform collection
#
# Usage:
#   ansible-playbook tests/test_deploy_k3s.yml -i tests/inventory.ini \
#     -e bundle_file=/opt/virtru-dsp-bundle-v2.0.6.1.tar.gz \
#     -e domain=dsp.vm
#
# Check mode (dry run):
#   ansible-playbook tests/test_deploy_k3s.yml -i tests/inventory.ini --check
#
# Post-deploy policy configuration (namespaces, attributes, KAS keys,
# subject/resource mappings, etc.) is handled by the separate `dsp.tructl`
# collection. This playbook deploys and verifies infrastructure health only.
- name: Test DSP deployment on K3s
  hosts: dsp
  become: true
  gather_facts: true

  vars:
    bundle_file: "{{ lookup('env', 'DSP_BUNDLE_FILE') | default('/opt/virtru-dsp-bundle.tar.gz', true) }}"
    domain: "{{ lookup('env', 'DSP_DOMAIN') | default('dsp.vm', true) }}"

  tasks:
    - name: Deploy DSP on K3s
      virtru.dsp_platform.deploy_k3s:
        domain: "{{ domain }}"
        bundle_file: "{{ bundle_file }}"
        namespace: virtru
        registry_url: localhost:8888/virtru
        registry_insecure: true
        playground: true
        mac_m4_host: "{{ ansible_architecture == 'arm64' }}"
      register: deploy_result
      tags: [deploy]

    - name: Show deployment results
      ansible.builtin.debug:
        var: deploy_result
      tags: [deploy]

    - name: Verify DSP deployment
      virtru.dsp_platform.verify:
        namespace: virtru
        helm_release: dsp
        platform_url: "{{ deploy_result.platform_url }}"
        keycloak_url: "{{ deploy_result.keycloak_url }}"
        grpcurl_bin: "{{ deploy_result.dsp_bin | dirname }}/grpcurl"
        tls_no_verify: true
      register: verify_result
      tags: [verify]
      when: deploy_result is defined

    - name: Show verification results
      ansible.builtin.debug:
        var: verify_result
      tags: [verify]
      when: verify_result is defined
